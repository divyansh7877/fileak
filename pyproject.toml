[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fileak"
version = "0.1.0"
description = "Autonomous Dependency Fault-Injection & Leak Detection Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "hypothesis>=6.0",
]
test = [
    "pytest>=7.0",
    "hypothesis>=6.0",
]

[project.scripts]
fileak = "fileak.__main__:main"

[tool.setuptools.packages.find]
include = ["fileak*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
